[workspace]
members = [
    "crates/android-bridge",
    "crates/parser-cli",
    "crates/simple-cli",
    "crates/simple-core", "crates/simple-desktop",
    "crates/simple-parser", "crates/simple-server",
]
resolver = "3"

[workspace.dependencies]
# Error handling
anyhow = "1.0.100"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
futures = "0.3.31"
smol = "2.0.2"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
uuid = { version = "1.20.0", features = ["v4", "v7", "serde"] }
flume = "0.11"

# CLI
clap = { version = "4.5.30", features = ["derive"] }
logos = "0.15"
chumsky = "0.10"

# Web
axum = "0.8.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
dirs = "6.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
unicode-segmentation = "1.10"
schemars = "0.8"
smallvec = "1.15.1"
rust-embed = "8.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
im = "15.1.0"
regex = "1.12.2"
fuzzy-matcher = "0.3.7"
open = "5.3.3"
palette = "0.7"
rand = "0.9"
bitflags = { version = "2.11.0", features = ["serde"] }

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/brendon-felix/gpui-ce" }
gpui_macros = { git = "https://github.com/brendon-felix/gpui-ce" }
gpui_platform = { git = "https://github.com/brendon-felix/gpui-ce" }
