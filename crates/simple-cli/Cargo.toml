[package]
name = "simple-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "simple"
path = "src/main.rs"

[dependencies]
simple-core = { path = "../simple-core" }
anyhow = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
